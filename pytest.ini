[pytest]
testpaths = tests
addopts = -v --strict-markers
markers =
    smoke: Critical smoke tests for core functionality
    regression: Comprehensive regression test suite
    train_search: Train search form, station autocomplete, date and quota tests
    search_results: Train search results list, schedule, fare and availability tests
    login: Login page/dialog elements and validation tests
    registration: User registration page and required fields validation tests
    e2e: End-to-end train search workflows and full system tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
